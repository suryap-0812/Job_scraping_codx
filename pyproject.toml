[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scraping-codx"
version = "0.1.0"
description = "Tech opportunity scraping MVP for jobs, internships, and hackathons"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Codex"}]
dependencies = []

[project.scripts]
job-scraper = "job_scraping_codx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
